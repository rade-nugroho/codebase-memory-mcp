# Public front for the loopback-only CBM Atlas UI.
# The UI binds 127.0.0.1 and validates the Host header, so this proxy listens
# on the container interface, rewrites Host to the loopback form, and gates
# access with basic auth (the UI itself has none).
server {
    listen 9749;
    server_name _;

    auth_basic "CBM Atlas";
    auth_basic_user_file /etc/nginx/cbm-ui.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:9750;
        proxy_http_version 1.1;
        proxy_set_header Host "127.0.0.1:9750";
        # cbm rejects any non-loopback Origin (module-script/asset requests
        # carry the public origin) — strip it so the loopback contract holds.
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
